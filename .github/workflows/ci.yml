name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --workspace=fashion-api exec prisma validate
      - run: npm --workspace=fashion-api exec prisma generate
      - run: npm run check
      - run: npm test
      - run: npm run lint --workspace=fashion-storefront
      - run: npm run typecheck --workspace=fashion-storefront
      - run: npm run test --workspace=fashion-storefront
      - run: npm --workspace=fashion-admin run build
      - run: npm --workspace=fashion-storefront run build
